<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌘 Roue des Prénoms - Éclipse Solaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* === Ciel du crépuscule === */
      --dusk-orange: #f7b267;
      --dusk-peach: #f4845f;
      --dusk-blue: #577590;
      --dusk-deep: #2c3d55;
      --night-navy: #0b1026;
      --night-deep: #05070f;

      /* === Soleil & couronne === */
      --sun-core: #fff3c4;
      --sun-yellow: #ffd166;
      --sun-orange: #ff9f1c;
      --sun-deep: #e8801a;
      --corona: #ffe9a8;

      /* === Lune & espace === */
      --moon-dark: #16161f;
      --moon-gray: #2a2a38;
      --space-purple: #6c4f9e;
      --space-violet: #8b5cf6;
      --star-white: #f5f3ff;
      --silver: #c0c4d8;

      --gold: #d4af37;
      --gold-bright: #ffd700;
      --text-light: #f0edf5;
      --text-dark: #1b1830;
      --card-navy: #131a35;
      --card-navy-deep: #0c1226;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Nunito Sans', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--text-light);
      background-color: #6fb3e0;
      background-image:
        /* Ciel bleu de plein jour */
        linear-gradient(180deg,
          #2f7ab8 0%,
          #4f9ad4 30%,
          #8cc6ea 70%,
          #cde9f8 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      position: relative;
    }

    /* === Décor : télescope, lunettes d'éclipse, lune, étoiles === */
    .decor-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        /* Télescope sur trépied (bas gauche) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='180' viewBox='0 0 170 180'><g opacity='0.55' stroke='%23f0edf5' stroke-width='4' stroke-linecap='round' fill='none'><rect x='40' y='38' width='94' height='26' rx='13' transform='rotate(-28 87 51)' fill='%23f0edf5' opacity='0.25'/><rect x='40' y='38' width='94' height='26' rx='13' transform='rotate(-28 87 51)'/><circle cx='128' cy='26' r='9'/><line x1='82' y1='72' x2='82' y2='90'/><line x1='82' y1='90' x2='42' y2='168'/><line x1='82' y1='90' x2='122' y2='168'/><line x1='82' y1='90' x2='82' y2='168'/><line x1='58' y1='132' x2='106' y2='132' stroke-width='3'/></g></svg>"),
        /* Lunettes d'éclipse en carton (haut droite) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='190' height='80' viewBox='0 0 190 80'><g opacity='0.6'><rect x='8' y='18' width='80' height='44' rx='6' fill='%23ffd166' stroke='%23e8801a' stroke-width='3'/><rect x='102' y='18' width='80' height='44' rx='6' fill='%23ffd166' stroke='%23e8801a' stroke-width='3'/><rect x='18' y='27' width='60' height='26' rx='3' fill='%2316161f'/><rect x='112' y='27' width='60' height='26' rx='3' fill='%2316161f'/><rect x='88' y='30' width='14' height='12' rx='3' fill='%23ffd166' stroke='%23e8801a' stroke-width='3'/><circle cx='36' cy='36' r='3' fill='%23f5f3ff' opacity='0.5'/><circle cx='130' cy='36' r='3' fill='%23f5f3ff' opacity='0.5'/></g></svg>"),
        /* Croissant de lune (haut gauche) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><path d='M52 8 A34 34 0 1 0 52 72 A27 27 0 1 1 52 8 Z' fill='%23f5f3ff' opacity='0.5'/></svg>"),
        /* Petit télescope inversé (droite milieu) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='128' viewBox='0 0 170 180'><g opacity='0.35' stroke='%23f0edf5' stroke-width='4' stroke-linecap='round' fill='none' transform='scale(-1,1) translate(-170,0)'><rect x='40' y='38' width='94' height='26' rx='13' transform='rotate(-28 87 51)'/><circle cx='128' cy='26' r='9'/><line x1='82' y1='72' x2='82' y2='90'/><line x1='82' y1='90' x2='42' y2='168'/><line x1='82' y1='90' x2='122' y2='168'/><line x1='82' y1='90' x2='82' y2='168'/></g></svg>");
      background-position:
        2% 96%,
        95% 8%,
        6% 6%,
        98% 55%;
      background-repeat: no-repeat;
      background-size: 170px 180px, 190px 80px, 80px 80px, 120px 128px;
      pointer-events: none;
      z-index: 0;
    }

    /* === Voile d'obscurité progressif de l'éclipse (piloté en JS) === */
    #eclipseShade {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, var(--night-deep) 0%, var(--night-navy) 100%);
      opacity: 0;
      transition: opacity 2.5s ease;
      pointer-events: none;
      z-index: 0;
    }

    /* === Étoiles : elles ne se révèlent qu'à l'éclipse totale === */
    #starsLayer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 11% 16%, var(--star-white), transparent),
        radial-gradient(2px 2px at 26% 8%, var(--star-white), transparent),
        radial-gradient(1.5px 1.5px at 41% 22%, var(--star-white), transparent),
        radial-gradient(2px 2px at 58% 12%, var(--star-white), transparent),
        radial-gradient(1.5px 1.5px at 73% 25%, var(--star-white), transparent),
        radial-gradient(2px 2px at 88% 15%, var(--star-white), transparent),
        radial-gradient(1.5px 1.5px at 8% 45%, var(--star-white), transparent),
        radial-gradient(2px 2px at 93% 42%, var(--star-white), transparent),
        radial-gradient(1.5px 1.5px at 17% 72%, var(--star-white), transparent),
        radial-gradient(2px 2px at 34% 88%, var(--star-white), transparent),
        radial-gradient(1.5px 1.5px at 66% 82%, var(--star-white), transparent),
        radial-gradient(2px 2px at 82% 70%, var(--star-white), transparent),
        radial-gradient(1.5px 1.5px at 49% 60%, var(--star-white), transparent),
        radial-gradient(2px 2px at 95% 92%, var(--star-white), transparent);
      opacity: 0;
      transition: opacity 3s ease;
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      color: var(--sun-yellow);
      text-align: center;
      margin: 10px 0 5px 0;
      font-size: 38px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow:
        0 0 18px rgba(255, 209, 102, 0.6),
        0 0 40px rgba(255, 159, 28, 0.35),
        2px 2px 4px rgba(5, 7, 15, 0.6);
      position: relative;
      z-index: 1;
    }

    h1::before { content: "🌘 "; }
    h1::after { content: " 🌘"; }

    .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 7px;
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
      position: relative;
      z-index: 1;
      text-transform: uppercase;
      color: var(--text-light);
      text-shadow: 0 0 10px rgba(240, 237, 245, 0.4), 1px 1px 3px rgba(5, 7, 15, 0.6);
    }

    /* Phases de lune décoratives */
    .phases {
      display: flex;
      gap: 10px;
      margin-bottom: 55px;
      position: relative;
      z-index: 1;
      font-size: 17px;
      filter: drop-shadow(0 2px 4px rgba(5, 7, 15, 0.5));
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 800px;
      background: linear-gradient(180deg, var(--card-navy) 0%, var(--card-navy-deep) 100%);
      border-radius: 18px;
      padding: 45px 25px 30px;
      box-shadow:
        0 0 0 2px var(--gold),
        0 0 0 5px var(--night-deep),
        0 0 40px rgba(255, 209, 102, 0.15),
        0 20px 50px rgba(5, 7, 15, 0.6);
      position: relative;
      z-index: 1;
    }

    /* Médaillon éclipse en haut */
    .container::before {
      content: "☀️";
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, var(--sun-core) 0%, var(--sun-yellow) 55%, var(--sun-deep) 100%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      box-shadow:
        0 0 0 3px var(--night-deep),
        0 0 0 5px var(--gold),
        0 0 25px rgba(255, 209, 102, 0.7),
        0 6px 18px rgba(5, 7, 15, 0.5);
      z-index: 2;
    }

    .input-section {
      width: 100%;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
      position: relative;
      z-index: 2;
    }

    #namesInput {
      width: 90%;
      padding: 14px 18px;
      font-size: 15px;
      font-family: 'Nunito Sans', sans-serif;
      border: 1px solid var(--space-purple);
      border-radius: 10px;
      margin-bottom: 18px;
      background: rgba(5, 7, 15, 0.6);
      color: var(--text-light);
      transition: all 0.3s;
      box-shadow: inset 0 2px 8px rgba(5, 7, 15, 0.5);
    }

    #namesInput::placeholder {
      color: rgba(240, 237, 245, 0.35);
    }

    #namesInput:focus {
      outline: none;
      border-color: var(--sun-yellow);
      box-shadow:
        inset 0 2px 8px rgba(5, 7, 15, 0.5),
        0 0 0 3px rgba(255, 209, 102, 0.25),
        0 0 18px rgba(255, 209, 102, 0.2);
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      padding: 12px 22px;
      font-size: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #3a4468 0%, #252d4a 100%);
      color: var(--text-light);
      border: 1px solid var(--space-purple);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      box-shadow: 0 3px 0 #171d33, 0 5px 12px rgba(5, 7, 15, 0.5);
      position: relative;
      top: 0;
    }

    .btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #4a5580 0%, #333d61 100%);
      border-color: var(--space-violet);
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      top: 3px;
      box-shadow: 0 0 0 #171d33, 0 2px 5px rgba(5, 7, 15, 0.5);
    }

    .btn:disabled {
      background: linear-gradient(180deg, #2a2d3a 0%, #1e2130 100%);
      border-color: #3a3d4d;
      color: #6a6e80;
      box-shadow: 0 3px 0 #171923;
      cursor: not-allowed;
      opacity: 0.75;
    }

    /* Bouton éclipse en soleil éclatant */
    #spinWheel {
      background: linear-gradient(180deg, var(--sun-core) 0%, var(--sun-yellow) 45%, var(--sun-orange) 100%);
      color: var(--text-dark);
      border-color: var(--sun-deep);
      box-shadow:
        0 3px 0 var(--sun-deep),
        0 0 20px rgba(255, 209, 102, 0.45),
        0 5px 15px rgba(5, 7, 15, 0.4);
    }

    #spinWheel:hover:not(:disabled) {
      background: linear-gradient(180deg, #fff8dd 0%, var(--sun-core) 45%, var(--sun-yellow) 100%);
      box-shadow:
        0 3px 0 var(--sun-deep),
        0 0 30px rgba(255, 209, 102, 0.7),
        0 5px 15px rgba(5, 7, 15, 0.4);
    }

    /* Bouton créer en orange crépuscule */
    #createWheel {
      background: linear-gradient(180deg, var(--dusk-orange) 0%, var(--dusk-peach) 100%);
      color: var(--text-dark);
      border-color: #c9603f;
      box-shadow: 0 3px 0 #a34a2e, 0 5px 12px rgba(5, 7, 15, 0.4);
    }

    #createWheel:hover:not(:disabled) {
      background: linear-gradient(180deg, #fac488 0%, var(--dusk-orange) 100%);
    }

    /* Bouton reset en violet cosmique */
    #resetWheel:not(:disabled) {
      background: linear-gradient(180deg, var(--space-violet) 0%, var(--space-purple) 100%);
      border-color: #4d3673;
      box-shadow: 0 3px 0 #3c2a5c, 0 5px 12px rgba(5, 7, 15, 0.4);
    }

    #resetWheel:hover:not(:disabled) {
      background: linear-gradient(180deg, #a17ef7 0%, var(--space-violet) 100%);
    }

    .wheel-container {
      position: relative;
      width: 440px;
      height: 440px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0 30px 0;
    }

    /* Halo de couronne rotatif derrière le soleil */
    .corona-halo {
      position: absolute;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 233, 168, 0.28) 0deg 4deg,
        transparent 4deg 15deg
      );
      -webkit-mask-image: radial-gradient(circle, transparent 34%, black 40%, black 62%, transparent 72%);
      mask-image: radial-gradient(circle, transparent 34%, black 40%, black 62%, transparent 72%);
      opacity: 0.55;
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    /* Pendant le tirage : les rayons tournoient le temps de la translation */
    .wheel-container.spinning .corona-halo {
      animation: coronaSpin 4s linear infinite;
      opacity: 1;
    }

    @keyframes coronaSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .wheel-container.spinning #wheelCanvas {
      animation: sunPulse 1.1s ease-in-out infinite alternate;
    }

    @keyframes sunPulse {
      from { filter: drop-shadow(0 0 22px rgba(255, 209, 102, 0.55)); }
      to { filter: drop-shadow(0 0 45px rgba(255, 233, 168, 0.9)); }
    }

    #wheelCanvas {
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 22px rgba(255, 209, 102, 0.55));
    }

    .result {
      text-align: center;
      font-size: 24px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 15px;
      min-height: 55px;
      color: var(--sun-yellow);
      padding: 12px 25px;
      transition: all 0.4s;
      position: relative;
      z-index: 2;
      text-transform: uppercase;
    }

    .result:not(:empty) {
      background: linear-gradient(135deg, rgba(5, 7, 15, 0.9) 0%, rgba(19, 26, 53, 0.9) 100%);
      border-radius: 12px;
      box-shadow:
        0 0 0 1px var(--sun-yellow),
        0 0 0 4px var(--night-deep),
        0 0 0 5px var(--gold),
        0 0 30px rgba(255, 209, 102, 0.35),
        0 8px 25px rgba(5, 7, 15, 0.5);
      animation: eclipsePulse 0.7s ease-out;
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.7);
    }

    @keyframes eclipsePulse {
      0% { transform: scale(0.85); opacity: 0; filter: blur(6px); }
      50% { transform: scale(1.05); filter: blur(0); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ============================================
       LES OBSERVATEURS (liste)
       ============================================ */
    .name-list {
      width: 100%;
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(1.5px 1.5px at 14% 28%, rgba(245, 243, 255, 0.5), transparent),
        radial-gradient(1.5px 1.5px at 78% 18%, rgba(245, 243, 255, 0.45), transparent),
        radial-gradient(1.5px 1.5px at 42% 75%, rgba(245, 243, 255, 0.4), transparent),
        radial-gradient(1.5px 1.5px at 88% 65%, rgba(245, 243, 255, 0.45), transparent),
        linear-gradient(180deg, var(--night-navy) 0%, var(--night-deep) 100%);
      border-radius: 14px;
      padding: 25px 20px 20px;
      box-shadow:
        inset 0 0 0 1px var(--space-purple),
        inset 0 0 0 3px var(--night-deep),
        inset 0 0 0 4px var(--gold),
        inset 0 2px 15px rgba(5, 7, 15, 0.6);
      position: relative;
      z-index: 2;
    }

    .name-list h3 {
      margin: 0 0 18px 0;
      color: var(--sun-yellow);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 4px;
      font-size: 17px;
      padding-bottom: 12px;
      width: 100%;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.5);
      position: relative;
    }

    .name-list h3::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--sun-yellow) 50%, transparent 100%);
    }

    #namesList {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
    }

    .name-item {
      margin: 0;
      font-size: 15px;
      font-family: 'Nunito Sans', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(240, 237, 245, 0.95);
      padding: 9px 12px;
      border-radius: 9px;
      transition: all 0.2s;
      border-left: 5px solid var(--sun-yellow);
      box-shadow: 0 3px 10px rgba(5, 7, 15, 0.5);
    }

    /* Alternance solaire / lunaire */
    .name-item:nth-child(4n+1) { border-left-color: var(--sun-yellow); }
    .name-item:nth-child(4n+2) { border-left-color: var(--space-violet); }
    .name-item:nth-child(4n+3) { border-left-color: var(--sun-orange); }
    .name-item:nth-child(4n+4) { border-left-color: var(--silver); }

    .name-item:hover {
      transform: translateX(3px);
      box-shadow: 0 3px 14px rgba(255, 209, 102, 0.3);
    }

    .name-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--space-violet);
      cursor: pointer;
      flex-shrink: 0;
    }

    .name-item label {
      cursor: pointer;
      color: var(--text-dark);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .selected {
      text-decoration: line-through;
      color: #999 !important;
      opacity: 0.65;
    }

    /* Observateur "passé dans l'ombre" */
    .name-item:has(.selected) {
      border-left-color: var(--moon-gray) !important;
      background: rgba(42, 42, 56, 0.85);
      box-shadow: inset 0 0 8px rgba(5, 7, 15, 0.5);
    }

    .name-item:has(.selected) label {
      color: var(--silver) !important;
    }

    /* ============================================
       POPUP ÉCLIPSE !
       ============================================ */
    .goal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 7, 15, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .goal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .goal-popup {
      background:
        linear-gradient(135deg, var(--sun-yellow) 0%, var(--sun-orange) 30%, var(--space-violet) 70%, var(--night-navy) 100%);
      border-radius: 24px;
      padding: 8px;
      box-shadow:
        0 0 0 3px var(--gold-bright),
        0 0 70px rgba(255, 209, 102, 0.5),
        0 25px 70px rgba(0, 0, 0, 0.7);
      transform: scale(0.3) rotate(-8deg);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 90vw;
    }

    .goal-overlay.active .goal-popup {
      transform: scale(1) rotate(0deg);
    }

    .goal-popup-inner {
      background: linear-gradient(180deg, var(--card-navy) 0%, var(--night-deep) 100%);
      border-radius: 18px;
      padding: 42px 50px 35px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Petit soleil éclipsé décoratif dans la popup */
    .goal-popup-inner::before {
      content: "";
      position: absolute;
      top: 14px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 50%, var(--moon-dark) 58%, var(--sun-yellow) 60%);
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.6);
    }

    .goal-word {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 5px;
      margin: 0;
      background: linear-gradient(90deg, var(--sun-yellow), var(--sun-orange), var(--space-violet), var(--silver), var(--sun-yellow));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 2.5s linear infinite, eclipseShake 0.5s ease-in-out 3;
      text-transform: uppercase;
    }

    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes eclipseShake {
      0%, 100% { transform: translateX(0) scale(1); }
      20% { transform: translateX(-6px) scale(1.04); }
      40% { transform: translateX(6px) scale(1.06); }
      60% { transform: translateX(-4px) scale(1.04); }
      80% { transform: translateX(4px) scale(1.02); }
    }

    .goal-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 2px;
      margin: 14px 0 0 0;
      color: var(--text-light);
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(245, 243, 255, 0.4);
      animation: namePopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    }

    @keyframes namePopIn {
      0% { transform: scale(0) rotate(10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .goal-ball {
      font-size: 44px;
      display: inline-block;
      animation: moonDrift 2.2s ease-in-out infinite;
      margin-top: 14px;
    }

    @keyframes moonDrift {
      0%, 100% { transform: translateX(-24px); }
      50% { transform: translateX(24px); }
    }

    .goal-close-hint {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 13px;
      color: #6a708c;
      margin-top: 18px;
      animation: namePopIn 0.5s ease 1.2s both;
    }

    .confetti {
      position: fixed;
      width: 12px;
      height: 12px;
      top: -20px;
      z-index: 1001;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 22px; letter-spacing: 2px; }
      .subtitle { font-size: 10px; letter-spacing: 4px; }
      .phases { margin-bottom: 48px; font-size: 14px; }
      .wheel-container {
        width: 320px;
        height: 320px;
      }
      .corona-halo {
        width: 312px;
        height: 312px;
      }
      #wheelCanvas {
        width: 320px;
        height: 320px;
      }
      .container { padding: 38px 12px 25px; }
      .btn { padding: 10px 14px; font-size: 10px; letter-spacing: 1px; }
      #namesList { grid-template-columns: 1fr; }
      .result { font-size: 17px; letter-spacing: 1px; }
      .goal-word { font-size: 36px; letter-spacing: 3px; }
      .goal-name { font-size: 20px; }
      .goal-popup-inner { padding: 34px 25px 25px; }
    }
  </style>
</head>
<body>
  <div class="decor-layer"></div>
  <div id="eclipseShade"></div>
  <div id="starsLayer"></div>

  <h1>Roue des Prénoms</h1>
  <div class="subtitle">Éclipse Solaire</div>
  <div class="phases">🌕 🌖 🌗 🌘 🌑 🌒 🌓 🌔 🌕</div>

  <div class="container">
    <div class="input-section">
      <input type="text" id="namesInput" placeholder="Entrez les observateurs séparés par des point-virgules (ex: Hubble;Galilée;Cassini)">
      <div class="button-group">
        <button id="createWheel" class="btn">Préparer l'observation</button>
        <button id="spinWheel" class="btn" disabled>🌘 Lancer l'éclipse !</button>
        <button id="resetWheel" class="btn" disabled>Nouvelle éclipse</button>
        <button id="exportState" class="btn" disabled>Exporter</button>
        <input type="file" id="importFile" style="display:none;">
        <button id="importState" class="btn">Importer</button>
      </div>
    </div>

    <div class="wheel-container" id="wheelContainer">
      <div class="corona-halo"></div>
      <canvas id="wheelCanvas" width="400" height="400"></canvas>
    </div>

    <div class="result" id="result"></div>

    <div class="name-list">
      <h3>🔭 Les Observateurs</h3>
      <div id="namesList"></div>
    </div>
  </div>

  <!-- Popup Éclipse ! -->
  <div class="goal-overlay" id="goalOverlay">
    <div class="goal-popup">
      <div class="goal-popup-inner">
        <p class="goal-word">Éclipse !</p>
        <p class="goal-name" id="goalName"></p>
        <span class="goal-ball">🌘</span>
        <p class="goal-close-hint">Cliquez n'importe où pour fermer</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const wheelContainer = document.getElementById('wheelContainer');
      const createWheelBtn = document.getElementById('createWheel');
      const spinWheelBtn = document.getElementById('spinWheel');
      const resetWheelBtn = document.getElementById('resetWheel');
      const exportStateBtn = document.getElementById('exportState');
      const importStateBtn = document.getElementById('importState');
      const importFileInput = document.getElementById('importFile');
      const namesInput = document.getElementById('namesInput');
      const resultElem = document.getElementById('result');
      const namesListElem = document.getElementById('namesList');
      const goalOverlay = document.getElementById('goalOverlay');
      const goalNameElem = document.getElementById('goalName');
      const eclipseShade = document.getElementById('eclipseShade');
      const starsLayer = document.getElementById('starsLayer');

      let names = [];
      let selectedNames = [];
      let isSpinning = false;
      let initialized = false;
      let confettiTimers = [];
      let moonProgress = 0;      // position continue de la lune (0 = soleil plein, n = éclipse totale)
      let moonAnimFrame = null;  // animation en cours

      // Durée fixe du lancement : identique à chaque tirage, vitesse constante
      const ECLIPSE_DURATION = 4000;
      const linearEase = t => t;
      const smoothEase = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

      // Translation de la lune vers une position cible
      function animateMoon(target, duration, easing, onDone) {
        if (moonAnimFrame) cancelAnimationFrame(moonAnimFrame);
        const start = moonProgress;
        const delta = target - start;
        if (Math.abs(delta) < 0.001) {
          drawWheel();
          if (onDone) onDone();
          return;
        }
        const t0 = performance.now();
        function step(now) {
          const t = Math.min(1, (now - t0) / duration);
          moonProgress = start + delta * easing(t);
          drawWheel();
          if (t < 1) {
            moonAnimFrame = requestAnimationFrame(step);
          } else {
            moonAnimFrame = null;
            if (onDone) onDone();
          }
        }
        moonAnimFrame = requestAnimationFrame(step);
      }

      // Coche/décoche manuelle : rattrapage en douceur
      function animateMoonTo() {
        animateMoon(selectedNames.length, 1800, smoothEase, null);
      }

      // Synchronisation immédiate (création, import, réinitialisation, édition de la liste)
      function syncMoon() {
        if (moonAnimFrame) cancelAnimationFrame(moonAnimFrame);
        moonAnimFrame = null;
        moonProgress = selectedNames.length;
      }

      // ============================================
      // ASSOMBRISSEMENT PROGRESSIF DE LA PAGE
      // ============================================
      function updateEclipseShade() {
        const ratio = names.length > 0 ? selectedNames.length / names.length : 0;
        // Du ciel bleu de plein jour à la nuit noire complète, un cran par prénom révélé
        eclipseShade.style.opacity = ratio.toFixed(3);
        // Les étoiles n'apparaissent qu'à la toute dernière étape : l'éclipse totale
        starsLayer.style.opacity = (names.length > 0 && selectedNames.length >= names.length) ? '1' : '0';
      }

      createWheelBtn.addEventListener('click', () => {
        updateNamesFromInput();
        if (names.length < 2) {
          alert('Veuillez entrer au moins deux observateurs.');
          return;
        }
        initialized = true;
        syncMoon();
        drawWheel();
        updateNamesList();
        spinWheelBtn.disabled = false;
        resetWheelBtn.disabled = false;
        createWheelBtn.disabled = true;
        exportStateBtn.disabled = false;
        resultElem.textContent = '';
      });

      namesInput.addEventListener('input', () => {
        if (!initialized) return;
        updateNamesFromInput();
        syncMoon();
        drawWheel();
        updateNamesList();
        spinWheelBtn.disabled = selectedNames.length >= names.length;
      });

      function updateNamesFromInput() {
        const inputNames = namesInput.value.split(';').map(n => n.trim()).filter(n => n);
        const newSelected = selectedNames.filter(n => inputNames.includes(n));
        names = inputNames;
        selectedNames = newSelected;
      }

      spinWheelBtn.addEventListener('click', () => {
        if (isSpinning || names.length === 0 || selectedNames.length === names.length) return;
        isSpinning = true;
        resultElem.textContent = '';
        spinWheelBtn.disabled = true;
        wheelContainer.classList.add('spinning');

        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * names.length);
        } while (selectedNames.includes(names[randomIndex]));

        const selectedName = names[randomIndex];

        // La lune translate à vitesse constante pendant que les rayons tournoient ;
        // le prénom est révélé quand son croissant est entièrement couvert
        animateMoon(selectedNames.length + 1, ECLIPSE_DURATION, linearEase, () => {
          isSpinning = false;
          wheelContainer.classList.remove('spinning');
          selectedNames.push(selectedName);
          resultElem.textContent = `🌑 ${selectedName} entre dans l'ombre !`;
          updateNamesList();
          drawWheel();
          spinWheelBtn.disabled = selectedNames.length >= names.length;
          spinWheelBtn.textContent = spinWheelBtn.disabled
            ? "🌑 Éclipse totale"
            : `🌘 Lancer l'éclipse ! (${names.length - selectedNames.length} au soleil)`;

          showEclipseCelebration(selectedName);
        });
      });

      // ============================================
      // CÉLÉBRATION ÉCLIPSE : popup + confettis
      // ============================================
      const confettiColors = ['#ffd166', '#ff9f1c', '#8b5cf6', '#c0c4d8', '#f5f3ff', '#ffd700', '#6c4f9e'];

      function showEclipseCelebration(name) {
        goalNameElem.textContent = `${name} dans l'ombre`;
        goalOverlay.classList.add('active');
        launchConfetti();
      }

      function hideEclipseCelebration() {
        goalOverlay.classList.remove('active');
        stopConfetti();
      }

      goalOverlay.addEventListener('click', hideEclipseCelebration);

      function launchConfetti() {
        stopConfetti();
        for (let wave = 0; wave < 6; wave++) {
          const timer = setTimeout(() => {
            for (let i = 0; i < 25; i++) {
              createConfettiPiece();
            }
          }, wave * 450);
          confettiTimers.push(timer);
        }
      }

      function stopConfetti() {
        confettiTimers.forEach(t => clearTimeout(t));
        confettiTimers = [];
        document.querySelectorAll('.confetti').forEach(c => c.remove());
      }

      function createConfettiPiece() {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        const isCircle = Math.random() > 0.5;
        const size = 6 + Math.random() * 9;
        const startX = Math.random() * window.innerWidth;
        const drift = (Math.random() - 0.5) * 250;
        const duration = 2200 + Math.random() * 1800;
        const rotations = 360 + Math.random() * 720;

        piece.style.left = startX + 'px';
        piece.style.width = size + 'px';
        piece.style.height = (isCircle ? size : size * 0.55) + 'px';
        piece.style.background = color;
        piece.style.borderRadius = isCircle ? '50%' : '2px';
        // Certaines pièces scintillent comme des étoiles
        if (Math.random() > 0.7) {
          piece.style.boxShadow = `0 0 8px ${color}`;
        }

        document.body.appendChild(piece);

        const anim = piece.animate([
          {
            transform: `translate(0, 0) rotate(0deg)`,
            opacity: 1
          },
          {
            transform: `translate(${drift}px, ${window.innerHeight + 50}px) rotate(${rotations}deg)`,
            opacity: 0.7
          }
        ], {
          duration: duration,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        });

        anim.onfinish = () => piece.remove();
      }

      resetWheelBtn.addEventListener('click', () => {
        selectedNames = [];
        spinWheelBtn.disabled = false;
        spinWheelBtn.textContent = "🌘 Lancer l'éclipse !";
        createWheelBtn.disabled = false;
        exportStateBtn.disabled = false;
        initialized = false;
        syncMoon();
        drawWheel();
        updateNamesList();
        resultElem.textContent = '';
        hideEclipseCelebration();
      });

      exportStateBtn.addEventListener('click', () => {
        const data = `${names.join(';')}\nPASSED:${selectedNames.join(';')}`;
        const blob = new Blob([data], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'etat_roue.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      importStateBtn.addEventListener('click', () => importFileInput.click());

      importFileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          const content = e.target.result.trim();
          const lines = content.split('\n');
          if (lines.length < 1) return;
          names = lines[0].split(';').map(name => name.trim()).filter(name => name.length > 0);
          selectedNames = lines[1]?.startsWith('PASSED:') ? lines[1].substring(7).split(';').map(n => n.trim()) : [];
          namesInput.value = names.join(';');
          initialized = true;
          syncMoon();
          drawWheel();
          updateNamesList();
          spinWheelBtn.disabled = selectedNames.length >= names.length;
          resetWheelBtn.disabled = false;
          createWheelBtn.disabled = true;
          exportStateBtn.disabled = false;
          resultElem.textContent = '';
        };
        reader.readAsText(file);
      });

      // ============================================
      // LE SOLEIL EN ARCS VERTICAUX
      // La lune avance de droite à gauche :
      // le k-ième prénom tiré noircit le k-ième arc depuis la droite
      // ============================================
      function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        // On garde de la marge pour la couronne, toujours visible
        const R = Math.min(centerX, centerY) - 48;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // --- Couronne solaire (toujours visible, même à l'éclipse totale) ---
        drawCorona(centerX, centerY, R);

        // --- Disque solaire plein ---
        const sunGradient = ctx.createRadialGradient(centerX - R * 0.25, centerY - R * 0.25, R * 0.1, centerX, centerY, R);
        sunGradient.addColorStop(0, '#fff3c4');
        sunGradient.addColorStop(0.45, '#ffd166');
        sunGradient.addColorStop(0.8, '#ff9f1c');
        sunGradient.addColorStop(1, '#e8801a');

        ctx.beginPath();
        ctx.arc(centerX, centerY, R, 0, 2 * Math.PI);
        ctx.fillStyle = sunGradient;
        ctx.fill();

        // Quelques taches solaires discrètes
        ctx.fillStyle = 'rgba(232, 128, 26, 0.35)';
        [[-0.35, -0.2, 9], [0.15, 0.32, 7], [-0.05, -0.45, 5], [0.4, -0.1, 6]].forEach(([fx, fy, r]) => {
          ctx.beginPath();
          ctx.arc(centerX + fx * R, centerY + fy * R, r, 0, 2 * Math.PI);
          ctx.fill();
        });

        if (names.length > 0) {
          const n = names.length;
          const w = (2 * R) / n; // avancée de la lune à chaque tirage
          // Progression continue de la lune (animée) : 0 = soleil plein, n = éclipse totale
          const progress = Math.max(0, Math.min(n, moonProgress));
          const moonDx = (i) => 2 * R * (1 - i / n);

          // --- Ombre lunaire : un seul disque qui translate de droite à gauche ---
          if (progress > 0.001) {
            const mx = centerX + 2 * R * (1 - progress / n);
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, R, 0, 2 * Math.PI);
            ctx.clip();
            const moonGradient = ctx.createRadialGradient(mx, centerY, R * 0.2, mx, centerY, R);
            moonGradient.addColorStop(0, '#1c1c28');
            moonGradient.addColorStop(0.7, '#16161f');
            moonGradient.addColorStop(1, '#101018');
            ctx.fillStyle = moonGradient;
            ctx.beginPath();
            ctx.arc(mx, centerY, R + 0.6, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
          }

          // --- Prénoms tirés : chacun apparaît quand son croissant est entièrement dans l'ombre ---
          selectedNames.forEach((name, k) => {
            if (k >= n) return;
            if (progress < k + 1 - 0.02) return;
            // Bord d'attaque de la lune (à hauteur du centre) avant et après ce tirage
            const edgeBefore = moonDx(k) - R;     // coordonnée locale (0 = centre du soleil)
            const edgeAfter = moonDx(k + 1) - R;
            const midXLocal = (edgeBefore + edgeAfter) / 2;
            const midX = centerX + midXLocal;

            // Hauteur disponible dans le croissant : limitée par le bord de lune et par le disque solaire
            const maxYMoon = Math.sqrt(Math.max(0, R * R - (R - w / 2) * (R - w / 2)));
            const maxYSun = Math.sqrt(Math.max(0, R * R - midXLocal * midXLocal));
            const maxTextLength = Math.max(18, 2 * Math.min(maxYMoon, maxYSun) * 0.85);

            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, R, 0, 2 * Math.PI);
            ctx.clip();

            // Petits cratères lunaires si le croissant est assez large
            if (w > 22) {
              ctx.fillStyle = 'rgba(42, 42, 56, 0.8)';
              ctx.beginPath();
              ctx.arc(midX - w * 0.18, centerY - maxYMoon * 0.55, Math.min(4, w * 0.12), 0, 2 * Math.PI);
              ctx.fill();
              ctx.beginPath();
              ctx.arc(midX + w * 0.12, centerY + maxYMoon * 0.6, Math.min(3, w * 0.1), 0, 2 * Math.PI);
              ctx.fill();
            }

            // Le prénom s'affiche verticalement au cœur du croissant noirci
            ctx.translate(midX, centerY);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffd166';
            ctx.shadowColor = 'rgba(255, 209, 102, 0.6)';
            ctx.shadowBlur = 6;

            let fontSize = Math.min(15, Math.max(9, Math.floor(w * 0.62)));
            ctx.font = `bold ${fontSize}px "Nunito Sans", Arial`;
            if (ctx.measureText(name).width > maxTextLength) {
              fontSize = Math.max(7, Math.floor(fontSize * (maxTextLength / ctx.measureText(name).width)));
              ctx.font = `bold ${fontSize}px "Nunito Sans", Arial`;
            }
            ctx.fillText(name, 0, 0);
            ctx.shadowBlur = 0;
            ctx.restore();
          });
        }

        // --- Liseré du disque ---
        ctx.beginPath();
        ctx.arc(centerX, centerY, R, 0, 2 * Math.PI);
        ctx.strokeStyle = 'rgba(255, 233, 168, 0.9)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Le voile d'obscurité suit l'avancée de l'éclipse
        updateEclipseShade();
      }

      // Couronne solaire : halo + jets lumineux (déterministes)
      function drawCorona(centerX, centerY, R) {
        // Halo diffus
        const halo = ctx.createRadialGradient(centerX, centerY, R * 0.92, centerX, centerY, R + 46);
        halo.addColorStop(0, 'rgba(255, 233, 168, 0.85)');
        halo.addColorStop(0.35, 'rgba(255, 209, 102, 0.4)');
        halo.addColorStop(0.7, 'rgba(255, 159, 28, 0.15)');
        halo.addColorStop(1, 'rgba(255, 159, 28, 0)');
        ctx.beginPath();
        ctx.arc(centerX, centerY, R + 46, 0, 2 * Math.PI);
        ctx.fillStyle = halo;
        ctx.fill();

        // Jets de couronne (longueurs pseudo-aléatoires mais fixes)
        ctx.strokeStyle = 'rgba(255, 233, 168, 0.55)';
        ctx.lineCap = 'round';
        const rays = 28;
        for (let i = 0; i < rays; i++) {
          const angle = (i * 2 * Math.PI) / rays;
          // Longueur variable déterministe (motif de couronne irrégulier)
          const len = 14 + ((i * 7919) % 23);
          const w = 1.5 + ((i * 31) % 3) * 0.8;
          ctx.lineWidth = w;
          ctx.beginPath();
          ctx.moveTo(centerX + Math.cos(angle) * (R + 4), centerY + Math.sin(angle) * (R + 4));
          ctx.lineTo(centerX + Math.cos(angle) * (R + 4 + len), centerY + Math.sin(angle) * (R + 4 + len));
          ctx.stroke();
        }
      }

      function updateNamesList() {
        namesListElem.innerHTML = '';
        names.forEach(name => {
          const div = document.createElement('div');
          div.className = 'name-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = selectedNames.includes(name);
          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              if (!selectedNames.includes(name)) selectedNames.push(name);
            } else {
              selectedNames = selectedNames.filter(n => n !== name);
            }
            animateMoonTo();
            updateNamesList();
            spinWheelBtn.disabled = selectedNames.length >= names.length;
          });

          const label = document.createElement('label');
          label.textContent = name;
          if (checkbox.checked) label.classList.add('selected');

          div.appendChild(checkbox);
          div.appendChild(label);
          namesListElem.appendChild(div);
        });

        // L'obscurité suit aussi les coches manuelles
        updateEclipseShade();
      }

      // Premier rendu : soleil plein, ciel encore clair
      drawWheel();
    });
  </script>
</body>
</html>
