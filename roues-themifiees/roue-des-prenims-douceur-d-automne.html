<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍂 Roue des Prénoms - Douceur d'automne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* === Feuillage === */
      --rust: #c8553d;
      --rust-dark: #a2412d;
      --pumpkin: #e76f2e;
      --pumpkin-dark: #c4561c;
      --mustard: #e0a526;
      --mustard-dark: #b9851a;
      --mustard-deep: #8f6512;
      --burgundy: #8c2f39;
      --burgundy-dark: #6e222b;
      --burgundy-deep: #51171e;
      --olive: #7a7d3c;
      --olive-dark: #5e6130;
      --olive-deep: #45481f;
      --copper: #b5651d;
      --caramel: #d9a066;
      --wheat: #f2cc8f;

      /* === Bois & écorce === */
      --chestnut: #6b4226;
      --chestnut-dark: #4e2f1a;
      --bark: #5b3a24;
      --bark-dark: #3f2717;
      --wood-light: #d4a46c;
      --wood-mid: #c08a52;
      --wood-ring: #a8733f;

      /* === Grisaille === */
      --sky-dark: #6f7880;
      --sky-grey: #8d959a;
      --sky-mist: #aeb0ad;
      --mist: #e3e2da;
      --mist-light: #f1f0ea;
      --mist-dark: #c9c7bb;
      --slate: #5c6670;
      --slate-dark: #444c55;

      --text-dark: #3b2416;
      --text-light: #fff6e8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Mulish', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px 20px 90px;
      color: var(--text-dark);
      background-color: var(--sky-mist);
      background-image:
        /* Pâle soleil voilé derrière les nuages */
        radial-gradient(circle 80px at 78% 11%, rgba(255, 236, 200, 0.55) 0%, rgba(255, 236, 200, 0.15) 60%, transparent 76%),
        /* Brume chaude au ras du sol */
        radial-gradient(ellipse 120% 30% at 50% 100%, rgba(216, 180, 140, 0.6) 0%, transparent 70%),
        /* Ciel de grisaille */
        linear-gradient(180deg, var(--sky-dark) 0%, var(--sky-grey) 25%, var(--sky-mist) 50%, #c4bba9 75%, #d3b38c 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      position: relative;
    }

    /* ============================================
       DÉCOR DE FOND
       ============================================ */

    /* Nuages qui dérivent lentement */
    .sky {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      left: 0;
      background-repeat: no-repeat;
      background-size: contain;
      animation: cloudDrift linear infinite;
      will-change: transform;
    }

    @keyframes cloudDrift {
      from { transform: translateX(-40vw); }
      to { transform: translateX(110vw); }
    }

    .cloud.light {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='110' viewBox='0 0 300 110'><g fill='%23e9e8e3'><ellipse cx='80' cy='70' rx='70' ry='32'/><ellipse cx='140' cy='48' rx='62' ry='42'/><ellipse cx='210' cy='66' rx='72' ry='34'/><ellipse cx='150' cy='80' rx='125' ry='26'/></g></svg>");
    }

    .cloud.dark {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='110' viewBox='0 0 300 110'><g fill='%23858c92'><ellipse cx='75' cy='66' rx='66' ry='30'/><ellipse cx='135' cy='46' rx='58' ry='40'/><ellipse cx='205' cy='62' rx='70' ry='32'/><ellipse cx='145' cy='78' rx='122' ry='24'/></g></svg>");
    }

    .cloud.c1 { top: 2%;  width: 320px; height: 118px; opacity: 0.85; animation-duration: 120s; animation-delay: -15s; }
    .cloud.c2 { top: 14%; width: 260px; height: 96px;  opacity: 0.7;  animation-duration: 150s; animation-delay: -70s; }
    .cloud.c3 { top: 6%;  width: 380px; height: 140px; opacity: 0.6;  animation-duration: 180s; animation-delay: -110s; }
    .cloud.c4 { top: 24%; width: 220px; height: 82px;  opacity: 0.55; animation-duration: 135s; animation-delay: -40s; }
    .cloud.c5 { top: 32%; width: 300px; height: 110px; opacity: 0.45; animation-duration: 165s; animation-delay: -95s; }

    /* Branche nue, glands, châtaignes, citrouille, champignons, hérisson */
    .decor-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        /* Branche presque nue (haut gauche) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='160' viewBox='0 0 280 160'><g fill='none' stroke='%233f2717' stroke-linecap='round'><path d='M0 26 Q80 38 150 66 Q200 86 252 82' stroke-width='9'/><path d='M88 44 Q110 20 140 12' stroke-width='5'/><path d='M168 74 Q186 104 176 132' stroke-width='4'/><path d='M212 84 Q236 68 258 54' stroke-width='4'/><path d='M120 56 Q126 78 118 96' stroke-width='3'/></g><g><path d='M140 12 Q150 2 160 8 Q156 20 140 12 Z' fill='%23e0a526'/><path d='M176 132 Q188 136 186 150 Q172 148 176 132 Z' fill='%23c8553d'/><path d='M258 54 Q270 46 276 56 Q266 64 258 54 Z' fill='%238c2f39'/><path d='M118 96 Q128 100 126 114 Q114 110 118 96 Z' fill='%23e76f2e'/></g></svg>"),
        /* Glands (gauche) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='64' viewBox='0 0 90 64'><g opacity='0.85'><ellipse cx='26' cy='40' rx='12' ry='15' fill='%23c8955e'/><path d='M12 32 Q12 18 26 18 Q40 18 40 32 Z' fill='%236b4226'/><path d='M16 24 L36 24 M14 29 L38 29' stroke='%234e2f1a' stroke-width='1.5'/><path d='M26 18 L28 10' stroke='%234e2f1a' stroke-width='3' stroke-linecap='round'/><g transform='translate(38 6) rotate(22 26 36)'><ellipse cx='26' cy='40' rx='11' ry='14' fill='%23d4a46c'/><path d='M13 33 Q13 20 26 20 Q39 20 39 33 Z' fill='%235b3a24'/><path d='M17 26 L35 26 M15 30 L37 30' stroke='%233f2717' stroke-width='1.5'/></g></g></svg>"),
        /* Châtaignes (droite) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='64' viewBox='0 0 96 64'><g opacity='0.85'><path d='M10 44 Q12 16 32 14 Q52 16 54 44 Q44 54 32 54 Q20 54 10 44 Z' fill='%236b3a1f'/><path d='M12 44 Q32 54 52 44 Q44 58 32 58 Q20 58 12 44 Z' fill='%23d9b38c'/><ellipse cx='24' cy='27' rx='6' ry='3' fill='%23ffffff' opacity='0.35' transform='rotate(-30 24 27)'/><path d='M50 48 Q52 24 68 22 Q84 24 86 48 Q78 56 68 56 Q58 56 50 48 Z' fill='%23804621'/><path d='M52 48 Q68 56 84 48 Q78 60 68 60 Q58 60 52 48 Z' fill='%23d9b38c'/><ellipse cx='62' cy='33' rx='5' ry='2.5' fill='%23ffffff' opacity='0.35' transform='rotate(-30 62 33)'/></g></svg>"),
        /* Citrouille (bas gauche) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='100' viewBox='0 0 120 100'><g><ellipse cx='60' cy='64' rx='52' ry='33' fill='%23e76f2e' stroke='%23c4561c' stroke-width='2'/><ellipse cx='60' cy='64' rx='32' ry='33' fill='%23ef8442' stroke='%23c4561c' stroke-width='2'/><ellipse cx='60' cy='64' rx='12' ry='33' fill='%23e76f2e' stroke='%23c4561c' stroke-width='2'/><path d='M58 32 Q55 16 66 9' stroke='%235e6130' stroke-width='6' fill='none' stroke-linecap='round'/><path d='M64 22 Q82 10 90 24 Q76 30 64 22 Z' fill='%237a7d3c'/><ellipse cx='40' cy='54' rx='5' ry='10' fill='%23ffffff' opacity='0.2' transform='rotate(20 40 54)'/></g></svg>"),
        /* Champignons (bas droite) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='90' viewBox='0 0 110 90'><g><path d='M30 86 Q26 60 32 45 L48 45 Q54 60 50 86 Z' fill='%23efe0c2' stroke='%23c9b38c' stroke-width='2'/><path d='M12 48 Q14 16 40 14 Q66 16 68 48 Q40 54 12 48 Z' fill='%237b3f2a' stroke='%234e2f1a' stroke-width='2'/><ellipse cx='30' cy='28' rx='8' ry='4' fill='%23ffffff' opacity='0.2' transform='rotate(-20 30 28)'/><path d='M76 86 Q73 68 77 58 L88 58 Q92 68 90 86 Z' fill='%23efe0c2' stroke='%23c9b38c' stroke-width='2'/><path d='M64 60 Q66 38 82 36 Q98 38 100 60 Q82 64 64 60 Z' fill='%23a0522d' stroke='%234e2f1a' stroke-width='2'/></g></svg>"),
        /* Hérisson (bas droite) */
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='80' viewBox='0 0 130 80'><g><ellipse cx='26' cy='72' rx='5' ry='3' fill='%233f2717'/><ellipse cx='88' cy='72' rx='5' ry='3' fill='%233f2717'/><path d='M14 70 L20 42 L28 54 L34 30 L44 46 L52 22 L60 42 L70 20 L78 40 L88 26 L94 46 L104 38 L106 58 Q108 70 98 70 Z' fill='%236b4226' stroke='%234e2f1a' stroke-width='2' stroke-linejoin='round'/><path d='M98 70 Q102 50 114 56 Q125 61 124 67 Q118 72 98 70 Z' fill='%23d9b38c' stroke='%23a8733f' stroke-width='1.5'/><circle cx='125' cy='66' r='3' fill='%233f2717'/><circle cx='112' cy='60' r='2' fill='%233f2717'/><path d='M60 30 L66 34 L58 36 Z' fill='%23c8553d'/></g></svg>");
      background-position:
        0 0,
        3% 52%,
        97% 44%,
        2% calc(100% - 18px),
        97% calc(100% - 14px),
        84% calc(100% - 12px);
      background-repeat: no-repeat;
      background-size: 280px 160px, 90px 64px, 96px 64px, 120px 100px, 110px 90px, 130px 80px;
      pointer-events: none;
      z-index: 0;
    }

    /* Tapis de feuilles mortes au sol */
    .leaf-litter {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 64px;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='60' viewBox='0 0 180 60'><g><ellipse cx='20' cy='44' rx='14' ry='6' fill='%23c8553d' transform='rotate(-20 20 44)'/><ellipse cx='48' cy='50' rx='12' ry='5' fill='%23e0a526' transform='rotate(15 48 50)'/><ellipse cx='75' cy='40' rx='13' ry='6' fill='%238c2f39' transform='rotate(-35 75 40)'/><ellipse cx='102' cy='52' rx='14' ry='5' fill='%23e76f2e' transform='rotate(10 102 52)'/><ellipse cx='130' cy='44' rx='12' ry='6' fill='%23b5651d' transform='rotate(-10 130 44)'/><ellipse cx='158' cy='50' rx='13' ry='5' fill='%237a7d3c' transform='rotate(25 158 50)'/><ellipse cx='60' cy='30' rx='10' ry='4' fill='%23d9a066' transform='rotate(40 60 30)'/><ellipse cx='145' cy='28' rx='10' ry='4' fill='%23c8553d' transform='rotate(-45 145 28)'/></g></svg>"),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='60' viewBox='0 0 180 60'><g><ellipse cx='30' cy='50' rx='12' ry='5' fill='%23a0522d' transform='rotate(30 30 50)'/><ellipse cx='88' cy='46' rx='13' ry='5' fill='%23e0a526' transform='rotate(-25 88 46)'/><ellipse cx='140' cy='52' rx='12' ry='5' fill='%238c2f39' transform='rotate(15 140 52)'/></g></svg>"),
        linear-gradient(0deg, rgba(107, 66, 38, 0.55) 0%, rgba(107, 66, 38, 0) 100%);
      background-repeat: repeat-x, repeat-x, no-repeat;
      background-position: 0 bottom, 90px 4px, 0 0;
      background-size: 180px 60px, 180px 60px, 100% 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Tasse fumante */
    .mug {
      position: fixed;
      bottom: 22px;
      left: 150px;
      width: 58px;
      height: 54px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='58' height='54' viewBox='0 0 58 54'><path d='M42 22 Q56 22 54 34 Q52 42 40 42' fill='none' stroke='%238c2f39' stroke-width='5'/><path d='M6 14 L44 14 L41 46 Q40 51 35 51 L15 51 Q10 51 9 46 Z' fill='%238c2f39'/><ellipse cx='25' cy='14' rx='19' ry='4.5' fill='%235a3520'/><path d='M18 28 Q25 22 32 28 Q25 36 18 28 Z' fill='%23e0a526'/><path d='M25 24 L25 34' stroke='%238f6512' stroke-width='1.2'/></svg>");
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 0;
    }

    .steam {
      position: absolute;
      bottom: 42px;
      width: 7px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      filter: blur(2px);
      opacity: 0;
      animation: steamRise 3.2s ease-in-out infinite;
    }

    .steam.s1 { left: 14px; animation-delay: 0s; }
    .steam.s2 { left: 23px; animation-delay: 1.1s; }
    .steam.s3 { left: 32px; animation-delay: 2.2s; }

    @keyframes steamRise {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      30% { opacity: 0.75; }
      100% { transform: translate(5px, -28px) scaleX(1.7); opacity: 0; }
    }

    /* Couche des feuilles qui tombent (pilotée en JS) */
    #leafLayer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    .falling-leaf {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
      opacity: 0.88;
      filter: drop-shadow(1px 3px 2px rgba(40, 25, 15, 0.3));
    }

    .falling-leaf svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ============================================
       EN-TÊTE
       ============================================ */
    h1 {
      font-family: 'Caprasimo', Georgia, serif;
      font-weight: 400;
      color: var(--text-light);
      text-align: center;
      margin: 10px 0 2px 0;
      font-size: 50px;
      letter-spacing: 1px;
      text-shadow:
        0 3px 0 var(--chestnut-dark),
        0 6px 18px rgba(40, 30, 20, 0.35);
      position: relative;
      z-index: 1;
    }

    h1::before { content: "🍂 "; }
    h1::after { content: " 🍁"; }

    .subtitle {
      font-family: 'Caprasimo', Georgia, serif;
      font-size: 22px;
      margin-bottom: 8px;
      text-align: center;
      position: relative;
      z-index: 1;
      color: var(--wheat);
      text-shadow: 0 2px 0 var(--burgundy-deep), 0 3px 8px rgba(40, 30, 20, 0.4);
    }

    .autumn-strip {
      margin-bottom: 55px;
      position: relative;
      z-index: 1;
      font-size: 20px;
      letter-spacing: 8px;
      filter: drop-shadow(0 2px 3px rgba(40, 30, 20, 0.35));
    }

    /* ============================================
       CONTENEUR : brume grise d'octobre
       ============================================ */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 800px;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, 0.5) 0%, transparent 50%),
        linear-gradient(180deg, var(--mist-light) 0%, var(--mist) 60%, #d9d6c9 100%);
      border-radius: 16px;
      padding: 45px 25px 30px;
      box-shadow:
        0 0 0 3px var(--mist-light),
        0 0 0 7px var(--chestnut),
        0 20px 50px rgba(40, 30, 20, 0.4);
      position: relative;
      z-index: 1;
    }

    /* Médaillon feuille d'érable */
    .container::before {
      content: "🍁";
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, var(--wheat) 0%, var(--mustard) 60%, var(--mustard-dark) 100%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow:
        0 0 0 3px var(--mist-light),
        0 0 0 6px var(--chestnut),
        0 6px 18px rgba(40, 30, 20, 0.4);
      z-index: 2;
    }

    .input-section {
      width: 100%;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
      position: relative;
      z-index: 2;
    }

    #namesInput {
      width: 90%;
      padding: 14px 18px;
      font-size: 15px;
      font-family: 'Mulish', sans-serif;
      font-weight: 600;
      border: 2px solid var(--caramel);
      border-radius: 10px;
      margin-bottom: 18px;
      background: #f9f8f3;
      color: var(--text-dark);
      transition: border-color 0.3s, box-shadow 0.3s;
      box-shadow: inset 0 2px 4px rgba(59, 36, 22, 0.08);
    }

    #namesInput::placeholder {
      color: rgba(59, 36, 22, 0.42);
    }

    #namesInput:focus {
      outline: none;
      border-color: var(--rust);
      box-shadow:
        inset 0 2px 4px rgba(59, 36, 22, 0.08),
        0 0 0 3px rgba(200, 85, 61, 0.22);
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      padding: 12px 22px;
      font-size: 15px;
      font-family: 'Mulish', sans-serif;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(180deg, #6b7580 0%, var(--slate) 100%);
      color: var(--text-light);
      border: 2px solid var(--slate-dark);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 3px 0 #363d44, 0 5px 12px rgba(40, 30, 20, 0.25);
      position: relative;
      top: 0;
    }

    .btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #7b8590 0%, #6b7580 100%);
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      top: 3px;
      box-shadow: 0 0 0 #363d44, 0 2px 5px rgba(40, 30, 20, 0.25);
    }

    .btn:focus-visible {
      outline: 3px solid var(--mustard);
      outline-offset: 3px;
    }

    .btn:disabled {
      background: linear-gradient(180deg, #b9b6ad 0%, #a19e95 100%);
      border-color: #8a877e;
      color: #ebe9e3;
      box-shadow: 0 3px 0 #8a877e;
      cursor: not-allowed;
      opacity: 0.75;
    }

    /* Coup de vent : moutarde dorée */
    #spinWheel {
      background: linear-gradient(180deg, var(--wheat) 0%, var(--mustard) 55%, var(--mustard-dark) 100%);
      color: var(--text-dark);
      border-color: var(--mustard-dark);
      box-shadow: 0 3px 0 var(--mustard-deep), 0 5px 15px rgba(224, 165, 38, 0.4);
    }

    #spinWheel:hover:not(:disabled) {
      background: linear-gradient(180deg, #f8dcaa 0%, #e8b440 55%, var(--mustard) 100%);
    }

    /* Ramasser les feuilles : vert olive */
    #createWheel {
      background: linear-gradient(180deg, #8e9248 0%, var(--olive) 50%, var(--olive-dark) 100%);
      border-color: var(--olive-dark);
      box-shadow: 0 3px 0 var(--olive-deep), 0 5px 12px rgba(40, 30, 20, 0.25);
    }

    #createWheel:hover:not(:disabled) {
      background: linear-gradient(180deg, #9da255 0%, #8e9248 100%);
    }

    /* Nouvelle saison : bordeaux */
    #resetWheel:not(:disabled) {
      background: linear-gradient(180deg, #a53b46 0%, var(--burgundy) 50%, var(--burgundy-dark) 100%);
      border-color: var(--burgundy-dark);
      box-shadow: 0 3px 0 var(--burgundy-deep), 0 5px 12px rgba(40, 30, 20, 0.25);
    }

    #resetWheel:hover:not(:disabled) {
      background: linear-gradient(180deg, #b84a55 0%, #a53b46 100%);
    }

    /* ============================================
       LA ROUE : tranche de tronc d'arbre
       ============================================ */
    .wheel-container {
      position: relative;
      width: 440px;
      height: 440px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 26px 0 34px 0;
    }

    /* Cernes du bois */
    .wheel-container::before {
      content: "";
      position: absolute;
      width: 462px;
      height: 462px;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 0 62%, rgba(63, 39, 23, 0.18) 100%),
        repeating-radial-gradient(circle,
          var(--wood-light) 0 5px,
          var(--wood-mid) 5px 7px,
          var(--wood-light) 7px 11px,
          var(--wood-ring) 11px 12.5px);
      box-shadow:
        inset 0 0 18px rgba(63, 39, 23, 0.45),
        0 16px 40px rgba(40, 30, 20, 0.45);
      z-index: 0;
    }

    /* Écorce rugueuse tout autour */
    .wheel-container::after {
      content: "";
      position: absolute;
      width: 488px;
      height: 488px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        var(--bark) 0deg 2deg,
        var(--bark-dark) 2deg 3.5deg,
        #6a4429 3.5deg 5deg
      );
      -webkit-mask-image: radial-gradient(circle, transparent 0 calc(50% - 13px), black calc(50% - 12px));
      mask-image: radial-gradient(circle, transparent 0 calc(50% - 13px), black calc(50% - 12px));
      z-index: 1;
      pointer-events: none;
    }

    #wheelCanvas {
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 4px 12px rgba(40, 30, 20, 0.35));
    }

    /* Pointeur bordeaux à cœur moutarde */
    .pointer {
      position: absolute;
      right: -26px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 24px solid transparent;
      border-bottom: 24px solid transparent;
      border-right: 48px solid var(--burgundy);
      z-index: 10;
      filter: drop-shadow(-3px 2px 5px rgba(40, 30, 20, 0.45));
    }

    .pointer::after {
      content: "";
      position: absolute;
      top: -16px;
      right: -44px;
      width: 0;
      height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-right: 32px solid var(--mustard);
    }

    .result {
      text-align: center;
      font-size: 26px;
      font-family: 'Caprasimo', Georgia, serif;
      margin-top: 15px;
      min-height: 55px;
      color: var(--chestnut-dark);
      padding: 12px 25px;
      position: relative;
      z-index: 2;
    }

    .result:not(:empty) {
      background: linear-gradient(135deg, var(--wheat) 0%, var(--caramel) 100%);
      border-radius: 12px;
      box-shadow:
        0 0 0 3px var(--mist-light),
        0 0 0 6px var(--burgundy),
        0 8px 25px rgba(40, 30, 20, 0.3);
      animation: gustIn 0.7s ease-out;
    }

    @keyframes gustIn {
      0% { transform: translateX(-30px) rotate(-3deg); opacity: 0; }
      60% { transform: translateX(6px) rotate(1deg); opacity: 1; }
      100% { transform: translateX(0) rotate(0deg); opacity: 1; }
    }

    /* ============================================
       LA CUEILLETTE : plaid écossais
       ============================================ */
    .name-list {
      width: 100%;
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        repeating-linear-gradient(90deg,
          rgba(140, 47, 57, 0.55) 0 10px, transparent 10px 22px,
          rgba(224, 165, 38, 0.5) 22px 24px, transparent 24px 36px,
          rgba(63, 39, 23, 0.35) 36px 44px, transparent 44px 56px),
        repeating-linear-gradient(0deg,
          rgba(140, 47, 57, 0.55) 0 10px, transparent 10px 22px,
          rgba(224, 165, 38, 0.5) 22px 24px, transparent 24px 36px,
          rgba(63, 39, 23, 0.35) 36px 44px, transparent 44px 56px),
        var(--copper);
      border-radius: 12px;
      padding: 22px 20px 20px;
      box-shadow:
        inset 0 0 0 4px rgba(78, 47, 26, 0.35),
        inset 0 0 25px rgba(40, 25, 15, 0.35),
        0 4px 14px rgba(40, 30, 20, 0.25);
      position: relative;
      z-index: 2;
    }

    .name-list h3 {
      margin: 0 0 18px 0;
      display: inline-block;
      padding: 6px 24px;
      color: var(--text-light);
      background: var(--chestnut-dark);
      border-radius: 30px;
      font-family: 'Caprasimo', Georgia, serif;
      font-weight: 400;
      font-size: 21px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(40, 25, 15, 0.4), inset 0 0 0 2px rgba(224, 165, 38, 0.5);
    }

    #namesList {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
    }

    .name-item {
      margin: 0;
      font-size: 15px;
      font-family: 'Mulish', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fbf9f3;
      padding: 9px 12px;
      border-radius: 9px;
      transition: transform 0.2s, box-shadow 0.2s;
      border-left: 6px solid var(--rust);
      box-shadow: 0 3px 8px rgba(40, 25, 15, 0.4);
    }

    /* Alternance des couleurs du feuillage */
    .name-item:nth-child(6n+1) { border-left-color: var(--rust); }
    .name-item:nth-child(6n+2) { border-left-color: var(--mustard); }
    .name-item:nth-child(6n+3) { border-left-color: var(--burgundy); }
    .name-item:nth-child(6n+4) { border-left-color: var(--olive); }
    .name-item:nth-child(6n+5) { border-left-color: var(--pumpkin); }
    .name-item:nth-child(6n+6) { border-left-color: var(--chestnut); }

    /* Petite trouvaille de la cueillette au bout de chaque étiquette */
    .name-item::after {
      margin-left: auto;
      font-size: 15px;
      opacity: 0.75;
      flex-shrink: 0;
    }
    .name-item:nth-child(3n+1)::after { content: "🍁"; }
    .name-item:nth-child(3n+2)::after { content: "🌰"; }
    .name-item:nth-child(3n+3)::after { content: "🍄"; }

    .name-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(40, 25, 15, 0.5);
    }

    .name-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--rust);
      cursor: pointer;
      flex-shrink: 0;
    }

    .name-item label {
      cursor: pointer;
      color: var(--text-dark);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .selected {
      text-decoration: line-through;
      color: #999 !important;
      opacity: 0.65;
    }

    /* Prénom emporté par le vent */
    .name-item:has(.selected) {
      border-left-color: var(--mist-dark) !important;
      background: rgba(223, 221, 212, 0.9);
      box-shadow: 0 2px 5px rgba(40, 25, 15, 0.3);
    }

    .name-item:has(.selected)::after {
      opacity: 0.3;
      filter: grayscale(1);
    }

    /* ============================================
       POPUP COUP DE VENT !
       ============================================ */
    .goal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(68, 76, 85, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .goal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .goal-popup {
      background: linear-gradient(135deg, var(--mustard) 0%, var(--rust) 35%, var(--burgundy) 70%, var(--olive) 100%);
      border-radius: 22px;
      padding: 8px;
      box-shadow:
        0 0 0 4px var(--mist-light),
        0 25px 70px rgba(30, 22, 15, 0.6);
      transform: scale(0.3) rotate(-10deg);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 90vw;
    }

    .goal-overlay.active .goal-popup {
      transform: scale(1) rotate(0deg);
    }

    .goal-popup-inner {
      background: linear-gradient(180deg, var(--mist-light) 0%, var(--mist) 100%);
      border-radius: 16px;
      padding: 44px 50px 34px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Frise de feuilles en haut de la popup */
    .goal-popup-inner::before {
      content: "";
      position: absolute;
      top: 6px; left: 0; right: 0;
      height: 18px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='18' viewBox='0 0 60 18'><ellipse cx='10' cy='9' rx='8' ry='4' fill='%23c8553d' transform='rotate(-25 10 9)'/><ellipse cx='30' cy='9' rx='8' ry='4' fill='%23e0a526' transform='rotate(20 30 9)'/><ellipse cx='50' cy='9' rx='8' ry='4' fill='%238c2f39' transform='rotate(-15 50 9)'/></svg>");
      background-size: 60px 18px;
      background-repeat: repeat-x;
    }

    .goal-word {
      font-family: 'Caprasimo', Georgia, serif;
      font-size: 60px;
      margin: 8px 0 0 0;
      background: linear-gradient(90deg, var(--rust), var(--mustard-dark), var(--burgundy), var(--olive), var(--rust));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: leafShift 2.5s linear infinite, gustShake 0.55s ease-in-out 3;
    }

    @keyframes leafShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes gustShake {
      0%, 100% { transform: translateX(0) skewX(0deg); }
      25% { transform: translateX(10px) skewX(-6deg); }
      50% { transform: translateX(-4px) skewX(3deg); }
      75% { transform: translateX(6px) skewX(-3deg); }
    }

    .goal-name {
      font-family: 'Caprasimo', Georgia, serif;
      font-size: 32px;
      margin: 12px 0 0 0;
      color: var(--chestnut-dark);
      animation: namePopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    }

    @keyframes namePopIn {
      0% { transform: scale(0) rotate(12deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .goal-ball {
      font-size: 46px;
      display: inline-block;
      animation: leafSwirl 2.4s ease-in-out infinite;
      margin-top: 12px;
    }

    @keyframes leafSwirl {
      0%, 100% { transform: translate(-24px, 0) rotate(-25deg); }
      50% { transform: translate(24px, -12px) rotate(30deg); }
    }

    .goal-close-hint {
      font-family: 'Mulish', sans-serif;
      font-size: 13px;
      color: #7d7a72;
      margin-top: 18px;
      animation: namePopIn 0.5s ease 1.2s both;
    }

    /* Feuilles de la bourrasque de célébration */
    .confetti {
      position: fixed;
      top: -40px;
      z-index: 1001;
      pointer-events: none;
      filter: drop-shadow(1px 3px 2px rgba(40, 25, 15, 0.3));
    }

    .confetti svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ============================================
       MOUVEMENT RÉDUIT & MOBILE
       ============================================ */
    @media (prefers-reduced-motion: reduce) {
      .cloud, .steam { animation: none; }
      .steam { opacity: 0.4; }
    }

    @media (max-width: 600px) {
      h1 { font-size: 30px; }
      .subtitle { font-size: 17px; }
      .autumn-strip { font-size: 16px; letter-spacing: 5px; margin-bottom: 48px; }
      .mug { display: none; }
      .wheel-container {
        width: 320px;
        height: 320px;
      }
      .wheel-container::before {
        width: 340px;
        height: 340px;
      }
      .wheel-container::after {
        width: 362px;
        height: 362px;
      }
      #wheelCanvas {
        width: 320px;
        height: 320px;
      }
      .pointer { right: -24px; }
      .container { padding: 38px 12px 25px; }
      .btn { padding: 10px 15px; font-size: 13px; }
      #namesList { grid-template-columns: 1fr; }
      .result { font-size: 20px; }
      .goal-word { font-size: 38px; }
      .goal-name { font-size: 23px; }
      .goal-popup-inner { padding: 36px 24px 24px; }
    }
  </style>
</head>
<body>
  <!-- Décor -->
  <div class="sky" aria-hidden="true">
    <div class="cloud light c1"></div>
    <div class="cloud dark c2"></div>
    <div class="cloud light c3"></div>
    <div class="cloud dark c4"></div>
    <div class="cloud light c5"></div>
  </div>
  <div class="decor-layer" aria-hidden="true"></div>
  <div class="leaf-litter" aria-hidden="true"></div>
  <div class="mug" aria-hidden="true">
    <span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span>
  </div>
  <div id="leafLayer" aria-hidden="true"></div>

  <h1>Roue des Prénoms</h1>
  <div class="subtitle">Douceur d'automne</div>
  <div class="autumn-strip" aria-hidden="true">🍁🌰🍄🎃🍄🌰🍁</div>

  <div class="container">
    <div class="input-section">
      <input type="text" id="namesInput" placeholder="Entrez les prénoms séparés par des point-virgules (ex: Jules;Rose;Victor)">
      <div class="button-group">
        <button id="createWheel" class="btn">🍂 Ramasser les feuilles</button>
        <button id="spinWheel" class="btn" disabled>🌬️ Coup de vent !</button>
        <button id="resetWheel" class="btn" disabled>Nouvelle saison</button>
        <button id="exportState" class="btn" disabled>Exporter</button>
        <input type="file" id="importFile" style="display:none;">
        <button id="importState" class="btn">Importer</button>
      </div>
    </div>

    <div class="wheel-container" id="wheelContainer">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="400" height="400"></canvas>
    </div>

    <div class="result" id="result"></div>

    <div class="name-list">
      <h3>🧺 La Cueillette</h3>
      <div id="namesList"></div>
    </div>
  </div>

  <!-- Popup Coup de vent ! -->
  <div class="goal-overlay" id="goalOverlay">
    <div class="goal-popup">
      <div class="goal-popup-inner">
        <p class="goal-word">Coup de vent !</p>
        <p class="goal-name" id="goalName"></p>
        <span class="goal-ball">🍁</span>
        <p class="goal-close-hint">Cliquez n'importe où pour fermer</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const createWheelBtn = document.getElementById('createWheel');
      const spinWheelBtn = document.getElementById('spinWheel');
      const resetWheelBtn = document.getElementById('resetWheel');
      const exportStateBtn = document.getElementById('exportState');
      const importStateBtn = document.getElementById('importState');
      const importFileInput = document.getElementById('importFile');
      const namesInput = document.getElementById('namesInput');
      const resultElem = document.getElementById('result');
      const namesListElem = document.getElementById('namesList');
      const goalOverlay = document.getElementById('goalOverlay');
      const goalNameElem = document.getElementById('goalName');
      const leafLayer = document.getElementById('leafLayer');

      let names = [];
      let selectedNames = [];
      let isSpinning = false;
      let initialized = false;
      let confettiTimers = [];

      // === Palette du feuillage d'automne (avec une touche de grisaille) ===
      let colors = [
        '#c8553d', // rouille
        '#e0a526', // moutarde
        '#8c2f39', // bordeaux
        '#7a7d3c', // olive
        '#e76f2e', // citrouille
        '#6b4226', // châtaigne
        '#f2cc8f', // blé
        '#5c6670', // ardoise (grisaille)
        '#b5651d', // cuivre
        '#a3a86b', // sauge
        '#9e2a2b', // brique
        '#d9a066'  // caramel
      ];

      const lightBackgrounds = ['#e0a526', '#e76f2e', '#f2cc8f', '#a3a86b', '#d9a066'];
      function getTextColor(bgColor) {
        return lightBackgrounds.includes(bgColor) ? '#3b2416' : '#fff6e8';
      }

      // ============================================
      // FEUILLES MORTES QUI TOMBENT (animation JS)
      // ============================================
      const LEAF_SHAPES = [
        { // érable
          path: 'M50 4 L58 24 L72 16 L68 37 L89 33 L79 49 L93 57 L70 62 L75 81 L56 71 L52 96 L48 96 L44 71 L25 81 L30 62 L7 57 L21 49 L11 33 L32 37 L28 16 L42 24 Z',
          vein: 'M50 92 L50 22 M50 62 L28 46 M50 62 L72 46'
        },
        { // chêne
          path: 'M50 4 C60 8 62 18 56 22 C66 22 70 32 60 36 C72 38 74 50 62 52 C72 56 70 68 58 68 C62 78 56 86 52 88 L52 97 L48 97 L48 88 C44 86 38 78 42 68 C30 68 28 56 38 52 C26 50 28 38 40 36 C30 32 34 22 44 22 C38 18 40 8 50 4 Z',
          vein: 'M50 92 L50 12'
        },
        { // feuille simple (hêtre, bouleau)
          path: 'M50 4 C80 24 86 58 52 88 L52 97 L48 97 L48 88 C14 58 20 24 50 4 Z',
          vein: 'M50 92 L50 14 M50 50 L34 36 M50 50 L66 36 M50 68 L36 56 M50 68 L64 56'
        }
      ];
      const LEAF_COLORS = ['#c8553d', '#e76f2e', '#e0a526', '#8c2f39', '#b5651d', '#d9a066', '#9e2a2b', '#7a7d3c', '#a0522d'];

      function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function leafSVG(shape, color) {
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="${shape.path}" fill="${color}"/><path d="${shape.vein}" fill="none" stroke="rgba(60,30,15,0.45)" stroke-width="3" stroke-linecap="round"/></svg>`;
      }

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const leaves = [];
      const BASE_WIND_MIN = -15;
      const BASE_WIND_MAX = 45;
      let wind = 20;          // vent actuel (px/s, positif = vers la droite)
      let windTarget = 20;    // vent visé
      let gusting = false;    // bourrasque en cours (pendant que la roue tourne)
      let lastFrame = performance.now();

      function resetLeaf(leaf, initial) {
        leaf.size = 18 + Math.random() * 22;
        leaf.x = Math.random() * window.innerWidth;
        leaf.y = initial ? Math.random() * window.innerHeight : -60 - Math.random() * 200;
        leaf.vy = 35 + Math.random() * 45;
        leaf.swayAmp = 20 + Math.random() * 40;
        leaf.swayFreq = 0.6 + Math.random() * 1.0;
        leaf.phase = Math.random() * Math.PI * 2;
        leaf.rot = Math.random() * 360;
        leaf.rotSpeed = (Math.random() - 0.5) * 140;
        leaf.flipFreq = 1 + Math.random() * 2;
        leaf.drag = 0.6 + Math.random() * 0.6;
        leaf.el.style.width = leaf.size + 'px';
        leaf.el.style.height = leaf.size + 'px';
        leaf.el.innerHTML = leafSVG(randomItem(LEAF_SHAPES), randomItem(LEAF_COLORS));
      }

      function tickLeaves(now) {
        const dt = Math.min(0.05, (now - lastFrame) / 1000);
        lastFrame = now;
        wind += (windTarget - wind) * Math.min(1, dt * 1.5);
        const t = now / 1000;
        const W = window.innerWidth;
        const H = window.innerHeight;
        const windFactor = 1 + Math.abs(wind) / 600;

        leaves.forEach(leaf => {
          leaf.y += leaf.vy * dt * windFactor;
          leaf.x += wind * leaf.drag * dt;
          leaf.rot += leaf.rotSpeed * dt * (1 + Math.abs(wind) / 150);
          const sway = Math.sin(t * leaf.swayFreq + leaf.phase) * leaf.swayAmp;
          const flip = Math.cos(t * leaf.flipFreq + leaf.phase);
          const flipScale = Math.sign(flip || 1) * Math.max(0.15, Math.abs(flip));

          if (leaf.y > H + 60) resetLeaf(leaf, false);
          if (leaf.x + sway > W + 80) leaf.x -= W + 160;
          if (leaf.x + sway < -80) leaf.x += W + 160;

          leaf.el.style.transform =
            `translate3d(${(leaf.x + sway).toFixed(1)}px, ${leaf.y.toFixed(1)}px, 0) rotate(${leaf.rot.toFixed(1)}deg) scaleX(${flipScale.toFixed(3)})`;
        });

        requestAnimationFrame(tickLeaves);
      }

      function initLeaves() {
        if (reduceMotion) return;
        const count = window.innerWidth < 600 ? 12 : 24;
        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'falling-leaf';
          leafLayer.appendChild(el);
          const leaf = { el };
          resetLeaf(leaf, true);
          leaves.push(leaf);
        }
        lastFrame = performance.now();
        requestAnimationFrame(tickLeaves);
      }

      // Brise changeante quand il n'y a pas de bourrasque
      setInterval(() => {
        if (!gusting) windTarget = BASE_WIND_MIN + Math.random() * (BASE_WIND_MAX - BASE_WIND_MIN);
      }, 5000);

      function startGust() {
        gusting = true;
        windTarget = 260;
      }

      function stopGust() {
        gusting = false;
        windTarget = 25;
      }

      initLeaves();

      // ============================================
      // FONCTIONNALITÉS (inchangées)
      // ============================================
      createWheelBtn.addEventListener('click', () => {
        updateNamesFromInput();
        if (names.length < 2) {
          alert('Veuillez entrer au moins deux prénoms.');
          return;
        }
        initialized = true;
        drawWheel();
        updateNamesList();
        spinWheelBtn.disabled = false;
        resetWheelBtn.disabled = false;
        createWheelBtn.disabled = true;
        exportStateBtn.disabled = false;
        resultElem.textContent = '';
      });

      namesInput.addEventListener('input', () => {
        if (!initialized) return;
        updateNamesFromInput();
        drawWheel();
        updateNamesList();
        spinWheelBtn.disabled = selectedNames.length >= names.length;
      });

      function updateNamesFromInput() {
        const inputNames = namesInput.value.split(';').map(n => n.trim()).filter(n => n);
        const newSelected = selectedNames.filter(n => inputNames.includes(n));
        names = inputNames;
        selectedNames = newSelected;
      }

      spinWheelBtn.addEventListener('click', () => {
        if (isSpinning || names.length === 0 || selectedNames.length === names.length) return;
        isSpinning = true;
        resultElem.textContent = '';
        spinWheelBtn.disabled = true;
        startGust();

        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * names.length);
        } while (selectedNames.includes(names[randomIndex]));

        const selectedName = names[randomIndex];
        const segmentAngle = (2 * Math.PI) / names.length;
        const targetAngle = -(segmentAngle * randomIndex + segmentAngle / 2) - Math.PI / 2;
        const fullSpins = 20 + Math.floor(Math.random() * 11);
        const finalRotation = (fullSpins * 2 * Math.PI) + targetAngle;

        canvas.style.transition = 'transform 8s cubic-bezier(0.17, 0.67, 0.15, 1)';
        canvas.style.transform = `rotate(${finalRotation}rad)`;

        setTimeout(() => {
          isSpinning = false;
          stopGust();
          selectedNames.push(selectedName);
          resultElem.textContent = `🍁 Le vent a emporté ${selectedName} !`;
          updateNamesList();
          drawWheel();
          spinWheelBtn.disabled = selectedNames.length >= names.length;
          spinWheelBtn.textContent = spinWheelBtn.disabled
            ? "🍂 L'arbre est nu"
            : `🌬️ Coup de vent ! (${names.length - selectedNames.length} sur l'arbre)`;

          showWindCelebration(selectedName);
        }, 8000);
      });

      // ============================================
      // CÉLÉBRATION : popup + bourrasque de feuilles
      // ============================================
      function showWindCelebration(name) {
        goalNameElem.textContent = `${name} s'envole !`;
        goalOverlay.classList.add('active');
        launchConfetti();
      }

      function hideWindCelebration() {
        goalOverlay.classList.remove('active');
        stopConfetti();
      }

      goalOverlay.addEventListener('click', hideWindCelebration);

      function launchConfetti() {
        stopConfetti();
        for (let wave = 0; wave < 5; wave++) {
          const timer = setTimeout(() => {
            for (let i = 0; i < 18; i++) {
              createConfettiPiece();
            }
          }, wave * 450);
          confettiTimers.push(timer);
        }
      }

      function stopConfetti() {
        confettiTimers.forEach(t => clearTimeout(t));
        confettiTimers = [];
        document.querySelectorAll('.confetti').forEach(c => c.remove());
      }

      function createConfettiPiece() {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        const size = 16 + Math.random() * 16;
        const startX = Math.random() * window.innerWidth;
        const drift = 80 + Math.random() * 260; // la bourrasque pousse vers la droite
        const duration = 2400 + Math.random() * 1800;
        const rotations = 360 + Math.random() * 720;
        const H = window.innerHeight;

        piece.style.left = startX + 'px';
        piece.style.width = size + 'px';
        piece.style.height = size + 'px';
        piece.innerHTML = leafSVG(randomItem(LEAF_SHAPES), randomItem(LEAF_COLORS));

        document.body.appendChild(piece);

        const anim = piece.animate([
          { transform: 'translate(0, 0) rotate(0deg) scaleX(1)', opacity: 1 },
          { transform: `translate(${(drift * 0.4 - 40).toFixed(0)}px, ${(H * 0.35).toFixed(0)}px) rotate(${(rotations * 0.35).toFixed(0)}deg) scaleX(-0.6)`, opacity: 1 },
          { transform: `translate(${(drift * 0.7 + 30).toFixed(0)}px, ${(H * 0.7).toFixed(0)}px) rotate(${(rotations * 0.7).toFixed(0)}deg) scaleX(0.8)`, opacity: 0.9 },
          { transform: `translate(${drift.toFixed(0)}px, ${H + 60}px) rotate(${rotations.toFixed(0)}deg) scaleX(-1)`, opacity: 0.75 }
        ], {
          duration: duration,
          easing: 'ease-in'
        });

        anim.onfinish = () => piece.remove();
      }

      resetWheelBtn.addEventListener('click', () => {
        selectedNames = [];
        spinWheelBtn.disabled = false;
        spinWheelBtn.textContent = "🌬️ Coup de vent !";
        createWheelBtn.disabled = false;
        exportStateBtn.disabled = false;
        initialized = false;
        canvas.style.transition = 'none';
        canvas.style.transform = 'rotate(0rad)';
        drawWheel();
        updateNamesList();
        resultElem.textContent = '';
        hideWindCelebration();
      });

      exportStateBtn.addEventListener('click', () => {
        const data = `${names.join(';')}\nPASSED:${selectedNames.join(';')}`;
        const blob = new Blob([data], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'etat_roue.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      importStateBtn.addEventListener('click', () => importFileInput.click());

      importFileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          const content = e.target.result.trim();
          const lines = content.split('\n');
          if (lines.length < 1) return;
          names = lines[0].split(';').map(name => name.trim()).filter(name => name.length > 0);
          selectedNames = lines[1]?.startsWith('PASSED:') ? lines[1].substring(7).split(';').map(n => n.trim()) : [];
          namesInput.value = names.join(';');
          initialized = true;
          drawWheel();
          updateNamesList();
          spinWheelBtn.disabled = selectedNames.length >= names.length;
          resetWheelBtn.disabled = false;
          createWheelBtn.disabled = true;
          exportStateBtn.disabled = false;
          resultElem.textContent = '';
        };
        reader.readAsText(file);
      });

      // ============================================
      // DESSIN DE LA ROUE
      // ============================================
      function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.min(centerX, centerY) - 10;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (names.length === 0) {
          drawTreeSlice(centerX, centerY, radius);
          drawPumpkin(centerX, centerY);
          return;
        }

        const segmentAngle = (2 * Math.PI) / names.length;
        const angleOffset = Math.PI / 2;

        for (let i = 0; i < names.length; i++) {
          const startAngle = i * segmentAngle + angleOffset;
          const endAngle = (i + 1) * segmentAngle + angleOffset;
          const segmentColor = colors[i % colors.length];
          const isSelected = selectedNames.includes(names[i]);

          const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.15, centerX, centerY, radius);
          if (isSelected) {
            gradient.addColorStop(0, '#c4c1b6');
            gradient.addColorStop(1, '#9d998e');
          } else {
            gradient.addColorStop(0, shadeColor(segmentColor, 15));
            gradient.addColorStop(0.6, segmentColor);
            gradient.addColorStop(1, shadeColor(segmentColor, -18));
          }

          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = gradient;
          ctx.fill();

          ctx.strokeStyle = '#f7f1e3';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(startAngle + segmentAngle / 2);
          ctx.textAlign = 'right';
          ctx.fillStyle = isSelected ? '#6e6a62' : getTextColor(segmentColor);
          ctx.font = 'bold 15px Mulish, Arial';

          if (!isSelected && getTextColor(segmentColor) === '#fff6e8') {
            ctx.shadowColor = 'rgba(40, 25, 15, 0.6)';
            ctx.shadowBlur = 3;
          }

          const textMaxLength = radius * 0.75;
          let fontSize = 15;
          if (ctx.measureText(names[i]).width > textMaxLength) {
            fontSize = Math.floor(fontSize * (textMaxLength / ctx.measureText(names[i]).width));
            ctx.font = `bold ${fontSize}px Mulish, Arial`;
          }
          ctx.fillText(names[i], radius - 20, 5);
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        drawPumpkin(centerX, centerY);
      }

      // Roue vide : tranche de bois avec ses cernes
      function drawTreeSlice(cx, cy, radius) {
        const woodGradient = ctx.createRadialGradient(cx, cy, 10, cx, cy, radius);
        woodGradient.addColorStop(0, '#e6bd88');
        woodGradient.addColorStop(1, '#c08a52');
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
        ctx.fillStyle = woodGradient;
        ctx.fill();

        ctx.strokeStyle = 'rgba(140, 90, 45, 0.55)';
        ctx.lineWidth = 1.5;
        for (let r = 44; r < radius; r += 11) {
          ctx.beginPath();
          ctx.ellipse(cx + Math.sin(r) * 1.5, cy + Math.cos(r * 0.7) * 1.5, r, r * 0.97, 0, 0, 2 * Math.PI);
          ctx.stroke();
        }

        // Petite fente du bois
        ctx.strokeStyle = 'rgba(78, 47, 26, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx + 40, cy + 30);
        ctx.lineTo(cx + 80, cy + 58);
        ctx.lineTo(cx + 104, cy + 70);
        ctx.lineTo(cx + 150, cy + 104);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = '#6b4226';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // Centre : une petite citrouille
      function drawPumpkin(cx, cy) {
        const r = 28;

        // Socle clair
        ctx.beginPath();
        ctx.arc(cx, cy, r + 9, 0, 2 * Math.PI);
        ctx.fillStyle = '#f7f1e3';
        ctx.fill();
        ctx.strokeStyle = '#6b4226';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Côtes de la citrouille (de l'extérieur vers le centre)
        const lobes = [
          { dx: -13, rx: 13 },
          { dx: 13, rx: 13 },
          { dx: -6, rx: 12 },
          { dx: 6, rx: 12 },
          { dx: 0, rx: 10 }
        ];
        lobes.forEach(lobe => {
          const lx = cx + lobe.dx;
          const ly = cy + 4;
          const g = ctx.createRadialGradient(lx - 3, ly - 6, 2, lx, ly, r * 0.8);
          g.addColorStop(0, '#f59a52');
          g.addColorStop(0.6, '#e76f2e');
          g.addColorStop(1, '#c4561c');
          ctx.beginPath();
          ctx.ellipse(lx, ly, lobe.rx, r * 0.76, 0, 0, 2 * Math.PI);
          ctx.fillStyle = g;
          ctx.fill();
          ctx.strokeStyle = '#a8461a';
          ctx.lineWidth = 1.3;
          ctx.stroke();
        });

        // Tige
        ctx.strokeStyle = '#5e6130';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, cy - r * 0.6);
        ctx.quadraticCurveTo(cx + 2, cy - r * 0.95, cx + 7, cy - r * 1.05);
        ctx.stroke();

        // Feuille
        ctx.beginPath();
        ctx.ellipse(cx + 13, cy - r * 0.88, 8, 3.8, -0.45, 0, 2 * Math.PI);
        ctx.fillStyle = '#7a7d3c';
        ctx.fill();

        // Reflet
        ctx.beginPath();
        ctx.ellipse(cx - 9, cy, 2.8, 7, 0.25, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fill();
      }

      function shadeColor(color, percent) {
        const f = parseInt(color.slice(1), 16);
        const t = percent < 0 ? 0 : 255;
        const p = Math.abs(percent) / 100;
        const R = f >> 16;
        const G = (f >> 8) & 0x00FF;
        const B = f & 0x0000FF;
        return "#" + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 +
          (Math.round((t - G) * p) + G) * 0x100 +
          (Math.round((t - B) * p) + B)).toString(16).slice(1);
      }

      function updateNamesList() {
        namesListElem.innerHTML = '';
        names.forEach(name => {
          const div = document.createElement('div');
          div.className = 'name-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = selectedNames.includes(name);
          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              if (!selectedNames.includes(name)) selectedNames.push(name);
            } else {
              selectedNames = selectedNames.filter(n => n !== name);
            }
            drawWheel();
            updateNamesList();
            spinWheelBtn.disabled = selectedNames.length >= names.length;
          });

          const label = document.createElement('label');
          label.textContent = name;
          if (checkbox.checked) label.classList.add('selected');

          div.appendChild(checkbox);
          div.appendChild(label);
          namesListElem.appendChild(div);
        });
      }

      // Premier rendu : la tranche de bois et sa citrouille
      drawWheel();
    });
  </script>
